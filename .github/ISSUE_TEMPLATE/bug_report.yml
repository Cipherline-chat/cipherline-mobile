name: Bug report
description: Something in the mobile app (closed beta) doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. **Security vulnerabilities go to security@cipherline.chat, not here** (see SECURITY.md).
        Please don't paste message content, keys, tokens, or other people's usernames.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and OS version
      placeholder: e.g. Pixel 8, Android 16 — or iPhone 16, iOS 26
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a screen recording help a lot for UI problems. Check them for private content first.
