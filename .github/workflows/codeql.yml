name: CodeQL

# Static analysis (SAST) with GitHub CodeQL. Today this repo holds no app source, so the only thing to analyse is the
# workflow files themselves (script injection, unsafe triggers, over-broad permissions). When the mobile source is
# published, add `javascript-typescript` (TypeScript / React Native) to the matrix below, with `build-mode: none`.
# Android (java-kotlin) and iOS (swift) native code would need a full platform build on the runner and is not worth it
# for an Expo app whose native projects are generated.
#
# Triggers: every push to main, every pull request into main (so "Analyze (actions)" can be a required status check in
# the "Protect main" ruleset: do not add path filters here, or a PR that skips the workflow could never merge), and a
# weekly run so new queries are applied to unchanged code.
#
# Builds and signs nothing, reads no secrets, GitHub-hosted runners only. Every action is pinned to a full commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
